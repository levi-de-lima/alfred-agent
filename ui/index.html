<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <!-- Anti-FOUC: aplica data-theme ANTES do CSS renderizar para evitar flash branco→escuro -->
  <script>
    (function(){
      var t = localStorage.getItem('alfred-theme');
      if (!t || t === 'system') {
        t = 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfred — TMB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/static/alfred-favicon.png" />
  <link rel="icon" type="image/svg+xml" href="/static/alfred-favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    /* ── 1. Design Tokens — variables.css inlined ───────────────── */
    :root {
      /* Marca — invariantes (não mudam entre temas) */
      --tmb-blue:          #0066FF;
      --tmb-blue-hover:    #0052CC;
      --tmb-blue-pressed:  #0041A3;
      --tmb-blue-light:    #E8F0FF;
      --tmb-black:         #0A0A0A;

      /* Semânticas */
      --success: #22C55E;
      --warning: #F59E0B;
      --danger:  #EF4444;
      --info:    var(--tmb-blue);

      /* Tipografia */
      --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-wordmark: 'Cinzel', serif;
      --font-mono:     'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
      --fw-regular:  400;
      --fw-medium:   500;
      --fw-semibold: 600;
      --fw-bold:     700;
      --fs-xs:   12px;
      --fs-sm:   13px;
      --fs-base: 15px;
      --fs-md:   16px;
      --fs-lg:   18px;
      --fs-xl:   20px;
      --fs-2xl:  24px;
      --fs-3xl:  32px;
      --lh-tight:   1.2;
      --lh-normal:  1.5;
      --lh-relaxed: 1.6;
      --ls-tight: -0.02em;
      --ls-wide:   0.05em;

      /* Espaçamento (escala 4px) */
      --space-1:  4px;
      --space-2:  8px;
      --space-3:  12px;
      --space-4:  16px;
      --space-5:  20px;
      --space-6:  24px;
      --space-8:  32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;

      /* Radius */
      --radius-sm:       6px;
      --radius-md:       8px;
      --radius-lg:       12px;
      --radius-xl:       18px;
      --radius-xl-tight: 4px;
      --radius-full:     9999px;

      /* Sombras */
      --shadow-none:   none;
      --shadow-subtle: 0 1px 2px rgba(10, 10, 10, 0.04);
      --shadow-card:   0 1px 3px rgba(10, 10, 10, 0.06), 0 1px 2px rgba(10, 10, 10, 0.04);

      /* Layout */
      --chat-max-width:             780px;
      --header-height:              56px;
      --input-bar-height:           72px;
      --message-gap:                16px;
      --user-bubble-max-width:      75%;
      --assistant-bubble-max-width: 85%;
      --bp-mobile:                  600px;
      --sidebar-width:              280px;

      /* Motion */
      --duration-fast:   120ms;
      --duration-normal: 200ms;
      --duration-slow:   400ms;
      --easing-standard: cubic-bezier(0.4, 0, 0.2, 1);

      /* z-index */
      --z-base:    0;
      --z-header:  10;
      --z-input:   10;
      --z-overlay: 19;
      --z-sidebar: 20;
      --z-toast:   50;
      --z-modal:   100;

      /* Status badges — business-specific, sem variante dark (cores fixas de negócio) */
      --status-ativo-bg:      #ECFDF5;
      --status-ativo-text:    #065F46;
      --status-prechurn-bg:   #FFFBEB;
      --status-prechurn-text: #92400E;
      --status-churn-bg:      #FEF2F2;
      --status-churn-text:    #991B1B;
      --status-inativo-bg:    #F3F4F6;
      --status-inativo-text:  #6B7280;
    }

    /* Tema claro (default) */
    :root,
    [data-theme="light"] {
      --bg:           #F7F7F5;
      --surface:      #FFFFFF;
      --surface-alt:  #FAFAFA;
      --border:       #E5E5E3;
      --border-strong:#D4D4D2;

      --text-primary:   #1A1A1A;
      --text-secondary: #6B6B6B;
      --text-muted:     #A0A0A0;

      --brand-accent:       var(--tmb-blue);
      --brand-accent-hover: var(--tmb-blue-hover);
      --brand-accent-light: var(--tmb-blue-light);

      --user-bubble:           var(--tmb-blue);
      --user-bubble-text:      #FFFFFF;
      --assistant-bubble:      #FFFFFF;
      --assistant-bubble-text: #1A1A1A;

      --code-bg: #F4F4F2;

      color-scheme: light;
    }

    /* Tema escuro — Charcoal Notion-style */
    [data-theme="dark"] {
      --bg:           #1A1A1A;
      --surface:      #242424;
      --surface-alt:  #2E2E2E;
      --border:       #3A3A3A;
      --border-strong:#4A4A4A;

      --text-primary:   #ECECEC;
      --text-secondary: #A0A0A0;
      --text-muted:     #6B6B6B;

      --brand-accent:       #4D8FFF;
      --brand-accent-hover: #6BA3FF;
      --brand-accent-light: #1A2E5C;

      --user-bubble:           #4D8FFF;
      --user-bubble-text:      #FFFFFF;
      --assistant-bubble:      #242424;
      --assistant-bubble-text: #ECECEC;

      --code-bg: #0F0F0F;

      --shadow-subtle: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-card:   0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.2);

      color-scheme: dark;
    }

    /* Auto-switch se não houver preferência salva */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:           #1A1A1A;
        --surface:      #242424;
        --surface-alt:  #2E2E2E;
        --border:       #3A3A3A;
        --border-strong:#4A4A4A;
        --text-primary:   #ECECEC;
        --text-secondary: #A0A0A0;
        --text-muted:     #6B6B6B;
        --brand-accent:       #4D8FFF;
        --brand-accent-hover: #6BA3FF;
        --brand-accent-light: #1A2E5C;
        --user-bubble:           #4D8FFF;
        --user-bubble-text:      #FFFFFF;
        --assistant-bubble:      #242424;
        --assistant-bubble-text: #ECECEC;
        --code-bg: #0F0F0F;
        color-scheme: dark;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      height: 100dvh;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    /* ── Main area (wraps header + chat + input) ────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── 2. Header ──────────────────────────────────────────────── */
    #header {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-6);
      height: var(--header-height);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: var(--z-header);
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    /* ── Alfred lockup ──────────────────────────────────────────── */
    #alfred-lockup {
      height: 32px;
      width: auto;
      color: var(--brand-accent);
      display: block;
    }

    /* ── Header right side ──────────────────────────────────────── */
    .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    #theme-toggle {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background var(--duration-fast), color var(--duration-fast);
      flex-shrink: 0;
    }

    #theme-toggle:hover {
      background: var(--brand-accent-light);
      color: var(--brand-accent);
    }

    #theme-toggle svg {
      transition: transform 200ms ease;
    }

    #theme-toggle:active svg {
      transform: rotate(15deg);
    }

    .header-sep {
      width: 1px;
      height: 24px;
      background: var(--border);
      opacity: 0.5;
      flex-shrink: 0;
    }

    .tmb-logo {
      height: 54px;
      width: auto;
      opacity: 0.85;
    }

    #tmb-logo-dark { display: none; }
    [data-theme="dark"] #tmb-logo-light { display: none; }
    [data-theme="dark"] #tmb-logo-dark  { display: block; }


    /* ── Chat wrapper ───────────────────────────────────────────── */
    #chat-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── Messages area ──────────────────────────────────────────── */
    #messages {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      padding: var(--space-4) var(--space-6) 140px;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }

    /* ── 6 & 7. Bubbles ─────────────────────────────────────────── */
    .bubble-row {
      display: flex;
      width: 100%;
    }

    .bubble-row.user { justify-content: flex-end; }

    .bubble-row.alfred {
      justify-content: flex-start;
      align-items: flex-start;
      gap: var(--space-3);
    }

    .bubble {
      font-size: var(--fs-base);
      line-height: var(--lh-relaxed);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .bubble.user {
      background: var(--user-bubble);
      color: var(--user-bubble-text);
      border-radius: 18px 18px 4px 18px;
      padding: 10px var(--space-4);
      max-width: 75%;
      font-size: var(--fs-base);
      line-height: var(--lh-normal);
      align-self: flex-end;
      white-space: pre-wrap;
    }

    .bubble.alfred {
      color: var(--text-primary);
      padding: 0;
      max-width: var(--assistant-bubble-max-width);
    }

    /* ── 5. Alfred avatar ───────────────────────────────────────── */
    .alfred-avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ── Separador entre rodadas Q&A ────────────────────────────── */
    .round-separator {
      border: none;
      border-top: 1px solid var(--border);
      opacity: 0.5;
      margin: var(--space-6) 0;
    }

    /* ── Markdown dentro da bolha Alfred ────────────────────────── */
    .bubble.alfred h1,
    .bubble.alfred h2,
    .bubble.alfred h3 {
      margin: var(--space-3) 0 6px;
      font-weight: var(--fw-semibold);
      line-height: var(--lh-tight);
    }
    .bubble.alfred h1 { font-size: 17px; }
    .bubble.alfred h2 { font-size: var(--fs-md); }
    .bubble.alfred h3 { font-size: var(--fs-base); }

    .bubble.alfred p { margin: 6px 0; }

    .bubble.alfred ul,
    .bubble.alfred ol {
      margin: 6px 0 6px var(--space-5);
    }

    .bubble.alfred li { margin: 3px 0; }

    .bubble.alfred strong { font-weight: var(--fw-semibold); }

    .bubble.alfred em { font-style: italic; }

    .bubble.alfred code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1px 5px;
      font-size: var(--fs-sm);
      font-family: var(--font-mono);
    }

    .bubble.alfred pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      overflow-x: auto;
      margin: var(--space-2) 0;
    }

    .bubble.alfred pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: var(--fs-sm);
    }

    .bubble.alfred hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: var(--space-3) 0;
    }

    .bubble.alfred blockquote {
      border-left: 3px solid var(--border);
      margin: var(--space-2) 0;
      padding-left: var(--space-3);
      color: var(--text-secondary);
    }

    /* Tabelas */
    .bubble.alfred table {
      border-collapse: collapse;
      border-radius: var(--radius-md);
      overflow: hidden;
      width: 100%;
      font-size: var(--fs-sm);
      margin: var(--space-2) 0;
      border: 1px solid var(--border);
    }

    .bubble.alfred th {
      background: var(--bg);
      color: var(--text-primary);
      font-weight: var(--fw-semibold);
      padding: var(--space-2) var(--space-3);
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .bubble.alfred td {
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--border);
      transition: background 80ms ease;
    }

    .bubble.alfred tbody tr:hover td {
      background: var(--brand-accent-light);
    }

    .bubble.alfred tr:last-child td { border-bottom: none; }

    .bubble.alfred tr:nth-child(even) td { background: var(--surface-alt); }

    /* Rodapé de citação */
    .bubble.alfred .citation {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin-top: 10px;
      font-style: italic;
    }

    /* ── Response footnote (info-box) ───────────────────────────── */
    .response-footnote {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--surface-alt);
      border-left: 2px solid var(--text-muted);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: var(--fs-xs);
      color: var(--text-secondary);
      margin-top: var(--space-4);
    }

    .response-footnote svg {
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--text-muted);
    }

    .response-footnote p { margin: 0; }
    .response-footnote p + p { margin-top: 4px; }

    /* ── Response note (footnote asteriscada gerada pelo modelo) ── */
    .response-note {
      font-size: 12px;
      color: var(--text-secondary);
      font-style: italic;
      font-weight: 400;
      margin: 16px 0 8px;
      line-height: 1.5;
    }

    /* ── 9. Status badges ───────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--fw-medium);
      white-space: nowrap;
    }
    .badge-ativo    { background: var(--status-ativo-bg);    color: var(--status-ativo-text); }
    .badge-prechurn { background: var(--status-prechurn-bg); color: var(--status-prechurn-text); }
    .badge-churn    { background: var(--status-churn-bg);    color: var(--status-churn-text); }
    .badge-inativo  { background: var(--status-inativo-bg);  color: var(--status-inativo-text); border: 1px solid var(--border); }

    /* ── Loading dots ───────────────────────────────────────────── */
    .loading-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: var(--space-4) var(--space-5);
    }

    .loading-bubble .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: dot-fade 1.2s infinite;
    }

    .loading-bubble .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-bubble .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-fade {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    /* ── 8. Input bar — flutuante ───────────────────────────────── */
    #input-bar {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      width: min(720px, calc(100% - 48px));
      background: transparent;
      z-index: var(--z-input);
    }

    #input-form {
      width: 100%;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: rgba(255, 255, 255, 0.85); /* var(--surface) light @ 0.85 */
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 6px 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    }

    [data-theme="dark"] #input-form {
      background: rgba(36, 36, 36, 0.85); /* var(--surface) dark @ 0.85 */
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    #input-form:focus-within {
      border-color: var(--brand-accent);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15),
                  0 0 0 3px var(--brand-accent-light);
    }

    [data-theme="dark"] #input-form:focus-within {
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4),
                  0 0 0 3px var(--brand-accent-light);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 10px var(--space-2);
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      color: var(--text-primary);
      resize: none;
      outline: none;
      min-height: 46px;
      max-height: 160px;
      overflow-y: auto;
      line-height: var(--lh-normal);
    }

    #user-input::placeholder { color: var(--text-muted); }

    #user-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── KPI value — sem quebra de linha, ellipsis pro overflow ─── */
    .kpi-value {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Fade overlay (sobre as mensagens, abaixo do input) ─────── */
    .fade-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 14px;
      height: 120px;
      pointer-events: none;
      background: linear-gradient(to bottom,
        transparent 0%,
        var(--bg) 60%,
        var(--bg) 100%);
      z-index: 5;
    }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: var(--brand-accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--duration-fast), transform var(--duration-fast);
    }

    #send-btn:hover  { background: var(--brand-accent-hover); }
    #send-btn:active { transform: scale(0.95); }

    #send-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    #send-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    /* ── 4. Welcome screen ──────────────────────────────────────── */
    #welcome-screen {
      position: absolute;
      top: calc(50% - 36px);
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 2;
    }

    #welcome-screen.fade-out { opacity: 0; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--surface-alt);
      border-right: 1px solid var(--border);
      overflow: hidden;
      z-index: var(--z-sidebar);
    }

    [data-theme="dark"] #sidebar {
      background: var(--surface);
    }

    .sidebar-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      flex-shrink: 0;
      gap: var(--space-1);
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: var(--fw-semibold);
      color: var(--text-secondary);
      flex: 1;
      padding: 0 var(--space-1);
    }

    #sidebar-menu-btn {
      display: none;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--text-secondary);
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--duration-fast), color var(--duration-fast);
    }

    #sidebar-menu-btn:hover {
      background: var(--brand-accent-light);
      color: var(--brand-accent);
    }

    #new-chat-btn {
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--duration-fast), color var(--duration-fast);
    }

    #new-chat-btn:hover {
      background: var(--brand-accent-light);
      color: var(--brand-accent);
    }

    #new-chat-btn:active {
      background: color-mix(in srgb, var(--brand-accent) 15%, transparent);
      color: var(--brand-accent);
    }

    #chat-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-2);
      border-top: 1px solid var(--border);
    }

    .chat-item {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border: none;
      border-left: 3px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      cursor: pointer;
      text-align: left;
      color: var(--text-primary);
      transition: background var(--duration-fast), border-left-color var(--duration-fast);
      position: relative;
    }

    .chat-item:hover { background: var(--brand-accent-light); }

    .chat-item.active {
      background: var(--brand-accent-light);
      border-left-color: var(--brand-accent);
      padding-left: 9px;
      color: var(--text-primary);
    }

    .chat-item.active .chat-item-time {
      color: var(--text-secondary);
    }

    .chat-item-title {
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      color: var(--text-primary);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding-right: 24px;
    }

    .chat-item-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-item-actions {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
    }

    .chat-item:hover .chat-item-actions,
    .chat-item-actions.open { display: flex; }

    .chat-item-menu-btn {
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      padding: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--duration-fast), color var(--duration-fast);
    }

    .chat-item-menu-btn:hover {
      background: var(--border);
      color: var(--text-primary);
    }

    .chat-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      z-index: 50;
      min-width: 148px;
      overflow: hidden;
    }

    .chat-dropdown button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 8px 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: var(--fs-sm);
      color: var(--text-primary);
      text-align: left;
      transition: background var(--duration-fast);
    }

    .chat-dropdown button:hover { background: var(--bg); }

    .chat-dropdown button.danger { color: var(--danger); }

    .chat-dropdown button.danger:hover { background: #FEF2F2; }

    [data-theme="dark"] .chat-dropdown button.danger:hover { background: #2D1515; }

    /* Empty state */
    .chat-list-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: var(--space-2);
      padding: var(--space-8) var(--space-4);
      text-align: center;
    }

    .chat-list-empty-title {
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      color: var(--text-secondary);
    }

    .chat-list-empty-sub {
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }

    /* Sidebar search */
    .chat-search {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: var(--space-2) var(--space-2) var(--space-2);
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    [data-theme="dark"] .chat-search {
      background: var(--surface-alt);
    }

    .chat-search:focus-within {
      border-color: var(--brand-accent);
    }

    .chat-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: var(--fs-sm);
      font-family: var(--font-sans);
    }

    .chat-search input::placeholder { color: var(--text-muted); }

    .chat-search svg { color: var(--text-muted); flex-shrink: 0; }

    .chat-search-empty {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      text-align: center;
      padding: var(--space-4) var(--space-2);
    }

    /* Skeleton loading */
    .chat-skeleton {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-radius: var(--radius-md);
    }

    .skeleton-line {
      height: 12px;
      border-radius: var(--radius-sm);
      background: var(--border);
      animation: shimmer 1.2s ease infinite;
    }

    .skeleton-line.short { width: 60%; }
    .skeleton-line.xshort { width: 30%; }

    @keyframes shimmer {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Sidebar footer */
    .sidebar-footer {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 var(--space-4);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-footer span {
      font-size: var(--fs-xs);
      color: var(--text-secondary);
    }

    /* Mobile overlay */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: var(--z-overlay);
    }

    #sidebar-overlay.visible { display: block; }

    /* Hamburger in main header (mobile only) */
    #header-menu-btn {
      display: none;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--text-secondary);
      align-items: center;
      justify-content: center;
      margin-right: var(--space-2);
      flex-shrink: 0;
      transition: background var(--duration-fast), color var(--duration-fast);
    }

    #header-menu-btn:hover {
      background: var(--brand-accent-light);
      color: var(--brand-accent);
    }

    /* ── Modal customizado (substitui prompt() nativo) ─────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: var(--z-modal);
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible { display: flex; }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: var(--space-6);
      width: 100%;
      max-width: 360px;
      margin: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .modal-title {
      font-size: var(--fs-base);
      font-weight: var(--fw-medium);
      color: var(--text-primary);
    }

    .modal-input {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 14px;
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
    }

    .modal-input:focus {
      border-color: var(--brand-accent);
      box-shadow: 0 0 0 3px var(--brand-accent-light);
    }

    .modal-actions {
      display: flex;
      gap: var(--space-2);
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 8px 18px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      transition: background var(--duration-fast);
    }

    .modal-btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .modal-btn-secondary:hover { background: var(--surface-alt); }

    .modal-btn-primary {
      background: var(--brand-accent);
      color: #fff;
    }

    .modal-btn-primary:hover { background: var(--brand-accent-hover); }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .bubble.user { max-width: 95%; }
    }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100dvh;
        width: min(var(--sidebar-width), 85vw);
        transform: translateX(-100%);
        transition: transform var(--duration-normal) ease;
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.15);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar-menu-btn {
        display: flex;
      }

      #header-menu-btn {
        display: flex;
      }

      #input-bar {
        bottom: var(--space-4);
        width: calc(100% - var(--space-8));
      }
    }
  </style>
</head>

  <!-- Modal — confirmação de exclusão -->
  <div id="confirm-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <p id="confirm-title" class="modal-title"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="modal-btn modal-btn-secondary">Cancelar</button>
        <button id="confirm-ok" class="modal-btn modal-btn-primary" style="background:var(--danger);">Apagar</button>
      </div>
    </div>
  </div>

  <script>
    // ── Estado global ─────────────────────────────────────────────
    let currentChatId = null;
    let WELCOME_SCREEN_HTML = '';

    // ── marked.js config ──────────────────────────────────────────
    marked.setOptions({
      breaks: true,
      gfm: true,
    });

    // ── DOM refs ──────────────────────────────────────────────────
    const messagesEl     = document.getElementById('messages');
    const inputEl        = document.getElementById('user-input');
    const sendBtn        = document.getElementById('send-btn');
    const chatListEl     = document.getElementById('chat-list');
    const chatSearchInput = document.getElementById('chat-search-input');
    const sidebarEl      = document.getElementById('sidebar');
    const overlayEl      = document.getElementById('sidebar-overlay');
    const newChatBtn     = document.getElementById('new-chat-btn');
    const headerMenuBtn  = document.getElementById('header-menu-btn');
    const sidebarMenuBtn = document.getElementById('sidebar-menu-btn');

    // ── Auto-resize textarea ──────────────────────────────────────
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    // ── Enter to send, Shift+Enter for newline ────────────────────
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener('click', handleSend);

    // ── 5. Alfred avatar — wyvern SVG (mesmo símbolo do favicon) ──
    const ALFRED_AVATAR_SVG = `<svg width="32" height="32" viewBox="402 431 1438 1235" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;display:block;" aria-hidden="true">
  <path fill="var(--brand-accent)" d="M1201.47 434.409C1246.04 424.568 1299.69 431.019 1338.03 455.812C1398.2 494.721 1419.33 572.682 1416.09 640.637C1415.77 647.265 1416.44 653.14 1414.03 659.514L1412.83 660.179C1407.01 656.145 1404.18 652.278 1399.32 648.498C1389.93 641.191 1376.3 630.209 1366.15 624.457C1353.26 664.064 1352.14 676.609 1324.83 710.395C1320.45 680.206 1314.1 664.59 1298.5 638.638C1237.04 663.12 1181.92 701.186 1137.25 749.987C1128.77 759.332 1118.78 770.718 1112.06 781.223C1174.62 751.489 1233.4 730.312 1303.41 754.324C1324.36 761.509 1354.22 778.862 1374.08 789.876C1456.98 835.861 1499.79 818.235 1582.75 798.733C1555.65 767.826 1534.02 738.129 1511.56 703.623C1530.31 711.2 1549.74 722.075 1569.07 730.26C1614.82 749.635 1661.78 766.033 1709.65 779.35C1744.64 789.437 1780.82 796.8 1816.47 804.28C1822.92 805.634 1829.21 806.198 1835.42 808.527C1834.06 810.884 1828.68 812.193 1825.86 812.909C1738.2 835.192 1650.78 870.421 1572.9 916.305C1554.67 927.043 1539.71 939.585 1522.49 950.632C1542.25 909.991 1557.85 883.886 1582.35 845.783C1500.22 883.024 1451.23 892.29 1362.53 859.489C1344.71 852.897 1323.32 842.582 1307.08 833.543C1272.04 814.048 1247.74 801.673 1208.57 819.997C1185.63 830.727 1148.74 855.157 1129.82 872.411C1147.08 880.247 1282.68 939.372 1291.38 940.044C1307.64 933.436 1338.24 903.421 1351.32 890.778C1366.23 985.48 1281.18 1053.88 1200.1 1081.03C1211.64 1054.01 1233.1 1009.69 1192.34 995.85C1164.38 986.168 1133.16 979.227 1103.37 983.07C1076.07 986.593 1052.7 1003.11 1027.91 1015.1C960.582 1047.67 850.463 1024.04 815.988 953.653C802.485 926.083 802.029 891.01 801.883 860.331C783.084 886.087 766.225 936.699 771.226 969.095C780.106 1026.61 822.712 1046.91 874.358 1062.53C808.161 1208.96 996.864 1284.22 1088.16 1351.08C1114.3 1370.23 1140.68 1389.44 1165.62 1410.12C1219.46 1454.77 1265.44 1508.11 1301.67 1567.93C1315.61 1591.23 1341.06 1639.55 1346.97 1665.97L997.812 1665.44L896.754 1665.36C881.409 1665.43 856.243 1666.35 841.629 1665.48C816.549 1602.61 769.369 1566.18 723.632 1519.58C704.507 1500.09 691.432 1482.16 675.032 1460.89C675.289 1480.38 676.799 1499.83 679.551 1519.13C681.901 1534.98 685.842 1552.7 686.724 1568.36C598.454 1481.03 563.055 1377.94 562.351 1254.65L562.324 1246.22C533.316 1296.63 521.992 1323.17 506.162 1378.27C462.045 1289.4 437.772 1189.29 470.542 1092.07C483.829 1052.22 504.46 1015.21 531.37 982.956C537.577 976.618 544.382 968.921 550.409 962.339C542.574 964.384 538.776 966.24 531.881 969.942C506.903 982.93 489.364 994.634 468.501 1013.88C459.831 1021.88 449.877 1032.25 441.115 1039.64C442.904 1018.12 449.54 996.057 456.594 975.75C476.092 919.625 503.367 877.299 548.613 838.876C590.358 803.426 628.12 784.621 677.009 760.411C658.77 760.37 640.34 762.552 621.871 761.844C562.734 759.58 503.675 747.893 460.172 704.501C418.528 662.964 403.483 604.888 402.163 547.507C402.052 542.654 402.284 535.421 402.747 530.618C430.124 580.485 462.132 621.446 519.516 638.306C586.55 658.002 656.422 632.631 714.914 599.981C805.555 549.158 907.095 486.814 1015.28 518.551C1023.35 521.092 1033.6 524.074 1041 528.166C1055.87 536.391 1074.29 539.133 1091 533.957C1134.19 520.578 1184.33 507.781 1226.42 491.876C1220.89 466.745 1214.49 456.84 1201.47 434.409ZM958.535 592.758C928.278 598.243 908.207 627.232 913.722 657.484C919.236 687.736 948.245 707.779 978.491 702.236C1008.7 696.7 1028.71 667.739 1023.2 637.528C1017.69 607.317 988.751 587.279 958.535 592.758ZM1251.04 533.22C1265.6 521.551 1271.41 519.513 1289.63 516.276C1306.36 515.654 1315.35 517.007 1331.78 519.239C1325.85 505.043 1314.51 489.439 1300.03 483.245C1294.74 480.939 1288.97 479.943 1283.22 480.342C1257.3 488.473 1254.83 509.663 1251.04 533.22Z"/>
</svg>`;

    // ── 9. Mapa de status para badges ─────────────────────────────
    const statusMap = {
      'ativo':     'badge-ativo',
      'pré-churn': 'badge-prechurn',
      'pre-churn': 'badge-prechurn',
      'churn':     'badge-churn',
      'inativo':   'badge-inativo',
    };

    // ── Add message bubble ────────────────────────────────────────
    function addBubble(role, content, citation) {
      if (role === 'user' && messagesEl.children.length > 0) {
        const sep = document.createElement('hr');
        sep.className = 'round-separator';
        messagesEl.appendChild(sep);
      }

      const row = document.createElement('div');
      row.className = `bubble-row ${role}`;

      if (role === 'alfred') {
        const avatar = document.createElement('div');
        avatar.className = 'alfred-avatar';
        avatar.innerHTML = ALFRED_AVATAR_SVG;
        row.appendChild(avatar);
      }

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;

      if (role === 'alfred') {
        let mainContent = content;
        let citationText = citation || null;

        const sep = '\n\n---\n_';
        const sepIdx = content.lastIndexOf(sep);
        if (sepIdx !== -1) {
          mainContent = content.slice(0, sepIdx);
          citationText = content.slice(sepIdx + sep.length).replace(/_$/, '').trim();
        }

        bubble.innerHTML = marked.parse(mainContent);

        bubble.querySelectorAll('td').forEach(td => {
          const val = td.textContent.trim().toLowerCase();
          if (statusMap[val]) {
            td.innerHTML = `<span class="badge ${statusMap[val]}">${td.textContent.trim()}</span>`;
          }
        });

        bubble.querySelectorAll('.alfred-chart').forEach(el => {
          try {
            let configStr = el.getAttribute('data-config');
            configStr = configStr.replace(
              /"callback":"__SUFFIX_([^"]*?)__"/g,
              (_, sfx) => `"callback": function(v){ return v + '${sfx}'; }`
            );
            const config = (new Function('return ' + configStr))();
            const canvas = el.querySelector('canvas');
            new Chart(canvas, config);
          } catch(e) {
            console.warn('alfred-chart init failed', e);
          }
        });

        if (citationText) {
          const cit = document.createElement('div');
          cit.className = 'response-footnote';
          const lines = citationText.split('\n').filter(l => l.trim());
          cit.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><div>${lines.map(l => `<p>${l}</p>`).join('')}</div>`;
          bubble.appendChild(cit);
        }
      } else {
        bubble.textContent = content;
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    // ── Loading indicator ─────────────────────────────────────────
    function addLoading() {
      const row = document.createElement('div');
      row.className = 'bubble-row alfred';

      const avatar = document.createElement('div');
      avatar.className = 'alfred-avatar';
      avatar.innerHTML = ALFRED_AVATAR_SVG;
      row.appendChild(avatar);

      const bubble = document.createElement('div');
      bubble.className = 'bubble alfred loading-bubble';
      bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
      return { row, bubble };
    }

    function setLoadingMessage(bubble, text) {
      bubble.innerHTML = `<span style="color:var(--text-muted);font-size:var(--fs-sm)">${text}</span>`;
    }

    // ── Scroll to bottom ──────────────────────────────────────────
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── Set loading state ─────────────────────────────────────────
    function setLoading(loading) {
      inputEl.disabled = loading;
      sendBtn.disabled = loading;
    }

    function updateBadge() {}

    // ── Main send handler ─────────────────────────────────────────
    async function handleSend() {
      const message = inputEl.value.trim();
      if (!message) return;

      // Garante que há um chat ativo
      if (!currentChatId) {
        const chat = await createChat();
        if (!chat) return;
      }

      dismissWelcome();
      addBubble('user', message);

      inputEl.value = '';
      inputEl.style.height = 'auto';

      setLoading(true);
      const { row: loadingRow, bubble: loadingBubble } = addLoading();

      const t15 = setTimeout(() => setLoadingMessage(loadingBubble,
        '<i>Servidor da Claude está sobrecarregado, isso pode demorar um pouco...</i>'), 15000);
      const t60 = setTimeout(() => setLoadingMessage(loadingBubble,
        'Ainda processando... Aguarde mais um momento.'), 60000);

      try {
        const res = await fetch('/chats/' + currentChatId + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();

        clearTimeout(t15); clearTimeout(t60);
        loadingRow.remove();

        if (data.error) {
          addBubble('alfred', data.error);
        } else {
          addBubble('alfred', data.markdown_response);
          updateBadge(data.data_citation);
        }

        // Atualiza sidebar imediatamente e depois de 3.5s para pegar título gerado pelo Haiku
        moveToTopAndRefreshTitle(currentChatId);
        setTimeout(() => moveToTopAndRefreshTitle(currentChatId), 3500);

      } catch (err) {
        clearTimeout(t15); clearTimeout(t60);
        loadingRow.remove();
        addBubble('alfred', 'Desculpe, ocorreu um erro ao processar sua pergunta. Tente novamente.');
        console.error('Erro na requisição:', err);
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    // ── Sidebar — helpers ─────────────────────────────────────────
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function timeAgo(isoStr) {
      const d   = new Date(isoStr);
      const now = new Date();
      const diff = Math.floor((now - d) / 1000);
      if (diff < 60)    return 'agora';
      if (diff < 3600)  return `há ${Math.floor(diff / 60)}m`;
      if (diff < 86400) return `há ${Math.floor(diff / 3600)}h`;
      const today = new Date(); today.setHours(0,0,0,0);
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
      if (d >= yesterday && d < today) return 'ontem';
      return d.toLocaleDateString('pt-BR', { day:'numeric', month:'short' }).replace('.','');
    }

    function renderEmptyState() {
      chatListEl.innerHTML = `
        <div class="chat-list-empty">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted)">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="chat-list-empty-title">Nenhuma conversa ainda</span>
          <span class="chat-list-empty-sub">Clique em + pra começar</span>
        </div>`;
    }

    function renderSkeletons() {
      chatListEl.innerHTML = Array.from({length:3}, () => `
        <div class="chat-skeleton">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line xshort"></div>
        </div>`).join('');
    }

    function buildChatItem(chat) {
      const btn = document.createElement('button');
      btn.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
      btn.dataset.chatId = chat.id;
      btn.innerHTML = `
        <span class="chat-item-title">${escapeHtml(chat.title)}</span>
        <span class="chat-item-time">${timeAgo(chat.updated_at)}</span>
        <div class="chat-item-actions">
          <button class="chat-item-menu-btn" aria-label="Opções">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
            </svg>
          </button>
        </div>`;
      btn.addEventListener('click', (e) => {
        if (e.target.closest('.chat-item-actions')) return;
        openChat(chat.id);
        if (window.innerWidth <= 768) closeSidebar();
      });
      btn.querySelector('.chat-item-menu-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        openDropdown(chat.id, btn);
      });
      return btn;
    }

    // ── Sidebar — carrega lista ───────────────────────────────────
    async function loadChatList() {
      renderSkeletons();
      try {
        const res = await fetch('/chats');
        if (!res.ok) throw new Error();
        const chats = await res.json();
        chatListEl.innerHTML = '';
        if (!chats.length) { renderEmptyState(); return []; }
        chats.forEach(chat => chatListEl.appendChild(buildChatItem(chat)));
        return chats;
      } catch {
        chatListEl.innerHTML = '';
        renderEmptyState();
        return [];
      }
    }

    // ── Sidebar — abre um chat ────────────────────────────────────
    async function openChat(id) {
      clearChatSearch();
      document.querySelectorAll('.chat-item').forEach(el =>
        el.classList.toggle('active', el.dataset.chatId === id));
      currentChatId = id;
      messagesEl.innerHTML = '';
      const welcome = document.getElementById('welcome-screen');
      if (welcome) welcome.remove();
      try {
        const res = await fetch('/chats/' + id);
        if (!res.ok) throw new Error();
        const chat = await res.json();
        chat.messages.forEach(msg => {
          if (msg.role === 'user') addBubble('user', msg.content);
          else addBubble('alfred', msg.content);
        });
        if (!chat.messages.length) showWelcomeScreen();
      } catch {
        addBubble('alfred', 'Erro ao carregar conversa.');
      }
      inputEl.focus();
    }

    function showWelcomeScreen() {
      if (!document.getElementById('welcome-screen') && WELCOME_SCREEN_HTML) {
        document.getElementById('chat-wrapper').insertAdjacentHTML('afterbegin', WELCOME_SCREEN_HTML);
      }
    }

    // ── Sidebar — cria novo chat ──────────────────────────────────
    async function createChat() {
      try {
        const res = await fetch('/chats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        if (!res.ok) throw new Error();
        const chat = await res.json();
        clearChatSearch();
        currentChatId = chat.id;
        const item = buildChatItem({ ...chat, preview: '' });
        chatListEl.querySelector('.chat-list-empty')?.remove();
        chatListEl.insertBefore(item, chatListEl.firstChild);
        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        messagesEl.innerHTML = '';
        const welcome = document.getElementById('welcome-screen');
        if (welcome) welcome.remove();
        showWelcomeScreen();
        inputEl.focus();
        return chat;
      } catch {
        return null;
      }
    }

    // ── Sidebar — move chat pro topo e atualiza título ────────────
    async function moveToTopAndRefreshTitle(chatId) {
      try {
        const [listRes, detailRes] = await Promise.all([
          fetch('/chats'),
          fetch('/chats/' + chatId),
        ]);
        if (!listRes.ok || !detailRes.ok) return;
        const [chats, detail] = await Promise.all([listRes.json(), detailRes.json()]);
        const chatMeta = chats.find(c => c.id === chatId);
        if (!chatMeta) return;
        const lastUser = [...detail.messages].reverse().find(m => m.role === 'user');
        chatMeta.preview = lastUser?.content ?? '';
        chatMeta.title   = detail.title;
        const existing = chatListEl.querySelector(`[data-chat-id="${chatId}"]`);
        if (existing) existing.remove();
        if (!chatListEl.querySelector('.chat-item') && !chatListEl.querySelector('.chat-skeleton')) {
          chatListEl.querySelector('.chat-list-empty')?.remove();
        }
        const newItem = buildChatItem(chatMeta);
        chatListEl.insertBefore(newItem, chatListEl.firstChild);
      } catch {}
    }

    // ── Sidebar — dropdown de ações ───────────────────────────────
    function openDropdown(chatId, itemBtn) {
      document.querySelectorAll('.chat-dropdown').forEach(d => {
        d.closest('.chat-item-actions')?.classList.remove('open');
        d.closest('.chat-item')?.style.removeProperty('z-index');
        d.remove();
      });
      const actionsEl = itemBtn.querySelector('.chat-item-actions');
      actionsEl.classList.add('open');
      itemBtn.style.zIndex = '2';
      const dropdown = document.createElement('div');
      dropdown.className = 'chat-dropdown';
      dropdown.innerHTML = `
        <button data-action="rename">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>Renomear
        </button>
        <button data-action="delete" class="danger">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/>
            <path d="M10,11v6"/><path d="M14,11v6"/>
          </svg>Apagar
        </button>`;
      itemBtn.querySelector('.chat-item-actions').appendChild(dropdown);

      dropdown.querySelector('[data-action="rename"]').addEventListener('click', async (e) => {
        e.stopPropagation();
        actionsEl.classList.remove('open');
        itemBtn.style.removeProperty('z-index');
        dropdown.remove();
        const titleEl = itemBtn.querySelector('.chat-item-title');
        const newTitle = await showPrompt('Novo nome da conversa', titleEl.textContent);
        if (!newTitle?.trim() || newTitle.trim() === titleEl.textContent) return;
        const res = await fetch('/chats/' + chatId, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle.trim() }),
        }).catch(() => null);
        if (res?.ok) titleEl.textContent = newTitle.trim();
      });

      dropdown.querySelector('[data-action="delete"]').addEventListener('click', async (e) => {
        e.stopPropagation();
        actionsEl.classList.remove('open');
        itemBtn.style.removeProperty('z-index');
        dropdown.remove();
        const confirmed = await showConfirm('Apagar esta conversa? Não dá pra desfazer.');
        if (!confirmed) return;
        await fetch('/chats/' + chatId, { method: 'DELETE' }).catch(() => {});
        const item = chatListEl.querySelector(`[data-chat-id="${chatId}"]`);
        if (item) item.remove();
        if (currentChatId === chatId) {
          currentChatId = null;
          messagesEl.innerHTML = '';
          document.getElementById('chat-empty-hint')?.remove();
          const next = chatListEl.querySelector('.chat-item');
          if (next) openChat(next.dataset.chatId);
          else renderEmptyState();
        }
      });

      const close = (e) => {
        if (!dropdown.contains(e.target) && !itemBtn.contains(e.target)) {
          actionsEl.classList.remove('open');
          itemBtn.style.removeProperty('z-index');
          dropdown.remove();
          document.removeEventListener('click', close);
        }
      };
      setTimeout(() => document.addEventListener('click', close), 0);
    }

    // ── Sidebar — mobile toggle ───────────────────────────────────
    function toggleSidebar() {
      const isOpen = sidebarEl.classList.toggle('open');
      overlayEl.classList.toggle('visible', isOpen);
    }

    function closeSidebar() {
      sidebarEl.classList.remove('open');
      overlayEl.classList.remove('visible');
    }

    newChatBtn.addEventListener('click', createChat);
    headerMenuBtn?.addEventListener('click', toggleSidebar);
    sidebarMenuBtn?.addEventListener('click', toggleSidebar);
    overlayEl.addEventListener('click', closeSidebar);

    // ── Sidebar search ────────────────────────────────────────────
    function clearChatSearch() {
      chatSearchInput.value = '';
      chatListEl.querySelectorAll('.chat-item').forEach(el => el.style.display = '');
      chatListEl.querySelector('.chat-search-empty')?.remove();
    }

    chatSearchInput.addEventListener('input', () => {
      const q = chatSearchInput.value.trim().toLowerCase();
      const items = chatListEl.querySelectorAll('.chat-item');
      let visible = 0;
      items.forEach(item => {
        const title = item.querySelector('.chat-item-title')?.textContent.toLowerCase() || '';
        const match = !q || title.includes(q);
        item.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      let noResult = chatListEl.querySelector('.chat-search-empty');
      if (visible === 0 && q) {
        if (!noResult) {
          noResult = document.createElement('div');
          noResult.className = 'chat-search-empty';
          chatListEl.appendChild(noResult);
        }
        noResult.textContent = `Nenhuma conversa com "${chatSearchInput.value}"`;
      } else if (noResult) {
        noResult.remove();
      }
    });

    // ── Modais customizados (substituem prompt/confirm nativos) ──
    function showConfirm(message) {
      return new Promise((resolve) => {
        const overlay  = document.getElementById('confirm-overlay');
        const titleEl  = document.getElementById('confirm-title');
        const okBtn    = document.getElementById('confirm-ok');
        const cancelBtn = document.getElementById('confirm-cancel');

        titleEl.textContent = message;
        overlay.classList.add('visible');
        overlay.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(() => okBtn.focus());

        function close(value) {
          overlay.classList.remove('visible');
          overlay.setAttribute('aria-hidden', 'true');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          overlay.removeEventListener('click', onOverlayClick);
          document.removeEventListener('keydown', onKeydown);
          resolve(value);
        }

        function onOk()    { close(true); }
        function onCancel() { close(false); }
        function onKeydown(e) { if (e.key === 'Escape') close(false); }
        function onOverlayClick(e) { if (e.target === overlay) close(false); }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        overlay.addEventListener('click', onOverlayClick);
        document.addEventListener('keydown', onKeydown);
      });
    }

    function showPrompt(title, defaultValue) {
      return new Promise((resolve) => {
        const overlay  = document.getElementById('modal-overlay');
        const titleEl  = document.getElementById('modal-title');
        const input    = document.getElementById('modal-input');
        const okBtn    = document.getElementById('modal-ok');
        const cancelBtn = document.getElementById('modal-cancel');

        titleEl.textContent = title;
        input.value = defaultValue || '';
        overlay.classList.add('visible');
        overlay.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(() => { input.focus(); input.select(); });

        function close(value) {
          overlay.classList.remove('visible');
          overlay.setAttribute('aria-hidden', 'true');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          input.removeEventListener('keydown', onKeydown);
          overlay.removeEventListener('click', onOverlayClick);
          resolve(value);
        }

        function onOk()    { close(input.value); }
        function onCancel() { close(null); }
        function onKeydown(e) {
          if (e.key === 'Enter')  { e.preventDefault(); close(input.value); }
          if (e.key === 'Escape') close(null);
        }
        function onOverlayClick(e) { if (e.target === overlay) close(null); }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        input.addEventListener('keydown', onKeydown);
        overlay.addEventListener('click', onOverlayClick);
      });
    }

    // ── Welcome screen dismiss ────────────────────────────────────
    function dismissWelcome() {
      const welcome = document.getElementById('welcome-screen');
      if (!welcome) return;
      welcome.classList.add('fade-out');
      setTimeout(() => welcome.remove(), 300);
    }

    // ── Theme toggle ──────────────────────────────────────────────
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('alfred-theme', t);
      document.getElementById('icon-moon').style.display = t === 'dark' ? 'none'  : 'block';
      document.getElementById('icon-sun').style.display  = t === 'dark' ? 'block' : 'none';
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ── Init ──────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
      // Captura HTML da welcome screen antes de qualquer remoção
      WELCOME_SCREEN_HTML = document.getElementById('welcome-screen')?.outerHTML ?? '';

      // Sincroniza ícones com o tema aplicado pelo anti-flicker script
      applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

      // Carrega histórico de chats
      const chats = await loadChatList();
      if (chats.length > 0) {
        // Abre o último chat editado (lista já vem ordenada por updated_at DESC)
        await openChat(chats[0].id);
      } else {
        // Nenhum chat ainda — foca no input (welcome screen já está visível)
        inputEl.focus();
      }

    });
  </script>
</body>
</html>
